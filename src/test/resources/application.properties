# Test configuration with H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway for tests - use JPA auto ddl instead
spring.flyway.enabled=false

# Disable cloudinary for tests
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Bank API mock config
bank.api.base-url=http://localhost:8081
bank.api.username=speakly
bank.api.key=apikey2
bank.api.destination-iban=ES1420805801101234567891

